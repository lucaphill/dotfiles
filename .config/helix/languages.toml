# introduce new language server
[language-server.scls]
command = "simple-completion-language-server"

[language-server.scls.config]
feature_words = false                # enable completion by word
feature_snippets = true              # enable snippets
snippets_first = true                # completions will return before snippets by default
case_sensitive = false               # when true, only exact-case matches are suggested; when false, exact-case matches are just prioritized first
snippets_inline_by_word_tail = false # suggest snippets by WORD tail, for example text `xsq|` become `x^2|` when snippet `sq` has body `^2`
feature_unicode_input = false        # enable "unicode input"
feature_paths = false                # enable path completion
feature_citations = false            # enable citation completion (only on `citation` feature enabled)


# write logs to /tmp/completion.log
[language-server.scls.environment]
RUST_LOG = "info,simple-completion-language-server=info"
LOG_FILE = "/tmp/completion.log"

# append language server to existed languages

[[language]]
name = "git-commit"
language-servers = [ "scls" ]

[[language]]
name = "cpp"
language-servers = [ "scls", "clangd" ]

[[language]]
name = "c"
language-servers = [ "scls", "clangd" ]

[[language]]
name = "bash"
language-servers = [ "scls", "bash-language-server" ]

[[language]]
name = "cmake"
language-servers = [ "scls", "neocmakelsp", "cmake-language-server" ]

[[language]]
name = "go"
language-servers = [ "scls", "gopls", "golangci-lint-lsp" ]

[[language]]
name = "java"
language-servers = [ "scls", "jdtls" ]

[[language]]
name = "json"
language-servers = [ "scls", "vscode-json-language-server" ]

[[language]]
name = "kdl"
language-servers = [ "scls" ]

[[language]]
name = "lua"
language-servers = [ "scls", "lua-language-server" ]

[[language]]
name = "nasm"
language-servers = [ "scls", "asm-lsp" ]


[[language]]
name = "odin"
language-servers = [ "scls", "ols" ]

[[language]]
name = "python"
language-servers = [ "scls", "ty", "ruff", "jedi", "pylsp", "zuban" ]

[[language]]
name = "zig"
language-servers = [ "scls", "zls" ]

[[language]]
name = "markdown"
soft-wrap.enable = true
# text-width = 80 < this is the default
soft-wrap.wrap-at-text-width = true
language-servers = ["markdown-oxide"]
# etc..

# introduce a new language to enable completion on any doc by forcing set language with :set-language stub
[[language]]
name = "stub"
scope = "text.stub"
file-types = []
shebangs = []
roots = []
auto-format = false
language-servers = [ "scls" ]
