[main]
include=~/.config/foot/themes/noctalia
font=JetBrainsMono Nerd Font:size=11
title=Foot@CachyOS
pad=0x0 center
# term=xterm-256color

[scrollback]
lines=10000
multiplier=3

[cursor]
style=underline
underline-thickness=2

[mouse]
hide-when-typing=yes

[key-bindings]
search-start=Control+Shift+f

[colors-dark]
alpha=0.8
