# Aparencia: tamanhos (niri: layout.kdl). As cores ficam em colors.conf.

# ─── Gaps ───
# niri: gaps 14 (entre janelas e nas bordas)
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=8
gap_outer_vertical=8
smart_gaps=0

# ─── Bordas ───
# niri: focus-ring width 2.5. O Mango so aceita inteiro.
border_px=3
no_border_when_single=0

# ─── Scratchpad ───
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# ─── group bar ───
always_show_group_bar=0
group_bar_height=10
group_bar_decorate_bg_color=0x13140fff
group_bar_decorate_border_width=0
group_bar_decorate_corner_radius=0
group_bar_decorate_font_desc=0

# ─── tab bar ───
tab_bar_height=10
tab_bar_decorate_bg_color=0x13140fff
tab_bar_decorate_border_width=0
tab_bar_decorate_corner_radius=0
tab_bar_decorate_font_desc=0

# ─── title message bar ───
title_message_bar_height=10
title_message_bar_decorate_bg_color=0x13140fff
title_message_bar_decorate_border_width=0
title_message_bar_decorate_corner_radius=0
title_message_bar_decorate_font_desc=0
