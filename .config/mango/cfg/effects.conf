# Efeitos visuais (niri: layout.kdl, rules.kdl e misc.kdl)

# ─── Blur ───
# niri: blur em todas as janelas, passes 2, noise 0.05, saturation 1.0.
# O offset 3.3 do niri nao tem igual aqui, entao radius ficou no padrao.

blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0

# ─── Sombras ───
# niri: softness 10, spread 3, offset 2x2, preta, so na janela focada.
# O Mango nao separa focada/inativa, entao todas as janelas tem sombra.
shadows=0
layer_shadows=0
shadow_only_floating=0
shadows_size=5
shadows_blur=10
shadows_position_x=2
shadows_position_y=2
shadows_color=0x000000ff

# ─── Cantos e opacidade ───
# niri: geometry-corner-radius 10
border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# ─── Dim ───
dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055
