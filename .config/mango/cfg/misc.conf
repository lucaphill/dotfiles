# Misc (niri: misc.kdl e input.kdl), separado por assunto

# ═══ System ═══

# ─── Autostart ───
exec_once=sh ~/.config/mango/wallpaper.sh
exec_once=gammastep -t 4700:4700 -l -7.1:-34.9
exec_once=mako
exec_once=wl-paste --watch cliphist store

# ─── Variaveis de ambiente ───
# Sao resetadas a cada reload da config. O XDG_CURRENT_DESKTOP o Mango ja define sozinho.
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORM,wayland
env=QT_QPA_PLATFORMTHEME,gtk3
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=GTK_IM_MODULE,simple
env=XDG_SESSION_TYPE,wayland

# ─── Cursor ───
cursor_theme=macOS
cursor_size=28
env=XCURSOR_THEME,macOS
env=XCURSOR_SIZE,28

# ─── Config ───
# Recarrega sozinho ao salvar (como o niri)
auto_reload_config=1

# ═══ Window behavior ═══

# ─── Flutuantes e drag ───
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
drag_tile_to_tile=1
drag_tile_small=1

# ─── Idle ───
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0

# ═══ Focus ═══

# ─── Foco e cursor ───
# niri: focus-follows-mouse (sem warp-mouse-to-focus)
sloppy_focus=1
warp_cursor=0
focus_on_activate=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
axis_bind_apply_timeout=100

# ═══ Tags (workspaces) ═══
tag_num=9
# niri: workspace-auto-back-and-forth
view_current_to_back=1
