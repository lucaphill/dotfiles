# Keybinds (niri: keybinds.kdl)
# Mod do niri = SUPER. Binds de scroll do mouse e gestos ficam em mouse-gestures.conf.
# Linhas comentadas sao binds do niri sem equivalente no Mango, com o motivo.
# Flag l no bind (bindl) = funciona com a tela bloqueada (allow-when-locked).
# Binds do Noctalia foram trocados por ferramentas independentes (fuzzel, mako, wpctl, brightnessctl, playerctl, grim, cliphist).

# ─── Applications ───
bind=SUPER,Return,spawn,foot
# Split do foot: o foot-split.sh depende de niri msg e consume-or-expel. Aqui abre um foot normal.
bind=SUPER+SHIFT,Return,spawn,foot
bind=SUPER,o,spawn,zen-browser
# Aviso: helix e editor de terminal, sem "foot -e" ele nao abre (no niri e igual). Titulo original diz Zed.
bind=SUPER+SHIFT,e,spawn,helix
bind=SUPER,e,spawn,foot -e spf

# ─── Launcher, Notifications, Clipboard, Wallpaper ───
bind=SUPER,space,spawn,fuzzel
# Notificacoes (mako): n traz de volta a ultima dispensada, Shift+n dispensa todas
bind=SUPER,n,spawn,makoctl restore
bind=SUPER+SHIFT,n,spawn,makoctl dismiss --all
# Historico da area de transferencia: precisa do exec-once=wl-paste --watch cliphist store
bind=SUPER,v,spawn_shell,cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
# Wallpaper aleatorio (script wallpaper.sh)
bind=SUPER+SHIFT,w,spawn_shell,sh ~/.config/mango/wallpaper.sh

# ─── Session ───
# Trava de tela: precisa instalar um locker (ex: swaylock) e descomentar
# bind=SUPER+ALT,l,spawn,swaylock
# Menu de sair, reiniciar, desligar e suspender (script session-menu.sh)
bind=SUPER+SHIFT,q,spawn_shell,sh ~/.config/mango/session-menu.sh
# Mod+Shift+Escape (show-hotkey-overlay): o Mango nao tem overlay de atalhos.

# ─── Utilities ───
# Mod+P (wl-mirror com niri msg focused-output): depende do niri msg. Troque pelo nome do monitor, ex: wl-mirror eDP-1
# bind=SUPER,p,spawn,wl-mirror eDP-1
bind=ALT,Tab,toggleoverview,
# Alt+Shift+Tab (window-switcher do Noctalia): sem equivalente, use o overview no Alt+Tab.
# Mod+Shift+C (pick-color): depende do niri msg pick-color. Alternativa: hyprpicker -a
# bind=SUPER+SHIFT,c,spawn,hyprpicker -a
bind=SUPER,d,spawn,fish -c define

# ─── Media Controls ───
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
# Play e Pause dividem a mesma tecla fisica no layout (keycode 172), entao precisam da flag c (permitir conflito)
bindlc=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindlc=NONE,XF86AudioPause,spawn,playerctl play-pause

# ─── Brightness ───
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl --min-value=5% set 5%-

# ─── Window Focus ───
# Iguais ao niri (no scroller: colunas na horizontal, janelas da coluna na vertical)
bind=SUPER,Left,focusdir,left
bind=SUPER,h,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,l,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,k,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,j,focusdir,down
# Deck: Super+Ctrl+Shift + H/L percorrem as abas (anterior/proxima)
bind=SUPER+CTRL+SHIFT,h,focusstack,prev
bind=SUPER+CTRL+SHIFT,l,focusstack,next
# Mod+Home, Mod+End, Mod+Ctrl+Home, Mod+Ctrl+End (primeira/ultima coluna): sem equivalente.

# ─── Window Movement ───
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,j,move_client,down

# ─── Monitors ───
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right
bind=SUPER+CTRL,Up,focusmon,up
bind=SUPER+CTRL,Down,focusmon,down
bind=SUPER+CTRL+SHIFT,Left,tagmon,left
bind=SUPER+CTRL+SHIFT,Right,tagmon,right
bind=SUPER+CTRL+SHIFT,Up,tagmon,up
bind=SUPER+CTRL+SHIFT,Down,tagmon,down

# ─── Consume / Expel ───
# consume-or-expel-window vira scroller_stack. O comportamento pode diferir do niri, teste.
# No ABNT2, [ e ] tambem existem em AltGr+8 e AltGr+9, o que conflitava com Super+8 e Super+9.
# Por isso usa o keycode da tecla: 35 = [ e 51 = ]
bind=SUPER,code:35,scroller_stack,left
bind=SUPER,code:51,scroller_stack,right
bind=SUPER+CTRL,h,scroller_stack,left
bind=SUPER+CTRL,l,scroller_stack,right

# ─── Tags (workspaces do niri) ───
# focus-workspace-up/down viram viewtoleft/right_have_client (pula tags vazias, como o niri).
bind=SUPER+CTRL,j,viewtoright_have_client,0
bind=SUPER+CTRL,k,viewtoleft_have_client,0
bind=SUPER+CTRL+SHIFT,j,tagtoright,0
bind=SUPER+CTRL+SHIFT,k,tagtoleft,0
bind=SUPER,Tab,view,-1,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# ─── Layout Controls ───
# Super+R alterna entre os layouts nesta ordem
circle_layout=scroller,deck,fair
bind=SUPER,r,switch_layout

bind=SUPER+SHIFT,f,set_proportion,0.5
# Sem equivalente no scroller do Mango:
# Mod+Shift+R e Mod+Ctrl+R (altura preset/reset da janela)
# Mod+C e Mod+Ctrl+C (center-column, center-visible-columns)
# Mod+Minus, Mod+Equal, Mod+Shift+Minus, Mod+Shift+Equal (ajuste relativo de largura/altura)

# ─── Modes ───
bind=SUPER,t,togglefloating,
# maximize-column vira togglemaximizescreen (aproximacao)
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+CTRL,f,togglefullscreen,
# Mod+W (toggle-column-tabbed-display): nao achei equivalente. Talvez groupjoin/groupfocus/groupleave, nao testado.
# Mod+M (maximize-window-to-edges) e Mod+Shift+T (switch-focus-between-floating-and-tiling): sem equivalente.

# ─── Screenshots ───
# Print: seleciona uma regiao com o mouse e copia para o clipboard
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy
# Niri copiava pro clipboard (screenshot-path null). Aqui usa grim + wl-copy.
bind=CTRL+SHIFT,2,spawn_shell,grim - | wl-copy
# Ctrl+Shift+3 (screenshot-window): o Mango nao tem screenshot de janela nativo.

# ─── Emergency Escape Key ───
# Mod+Escape (toggle-keyboard-shortcuts-inhibit): nao achei dispatcher equivalente.

# ─── Exit / Power ───
bind=CTRL+ALT,Delete,quit
# power-off-monitors vira sleep_monitor. Confirme se acorda ao mexer no mouse.
bind=SUPER+SHIFT,p,sleep_monitor,eDP-1

# ─── Extra (nao existia no niri, que recarrega sozinho) ───
bind=SUPER+ALT,r,reload_config
