# Regras de janela e layer (niri: rules.kdl, transparency.kdl)
# Formato: window_rule=parametro:valor,parametro:valor,app_id:regex,title:regex
# Cuidados: virgula separa parametros (nao use em regex) e "$palavra" vira variavel do Mango.

# ═══ Regras globais ═══
# Cantos arredondados (10) e blur global estao em effects.conf.
# O niri liberava activation mesmo com serial invalido (debug honor-xdg-activation-with-invalid-serial),
# usado pelo Noctalia pra acoes de notificacao e ativar janelas. Remova se nao precisar.
window_rule=activation_bypass:1,app_id:.*

# ═══ Por app ═══

# ─── Steam ───
# Todas as janelas flutuam, menos a principal (title "Steam")
window_rule=is_floating:1,app_id:^steam$,title:^(?![Ss]team$).*
# Toasts de notificacao: flutuante, sem roubar foco, canto inferior direito (posicao aproximada, ajuste offset_x e offset_y)
window_rule=is_floating:1,is_open_silent:1,offset_x:100,offset_y:100,app_id:^steam$,title:^notificationtoasts_\d+_desktop$

# ─── Nautilus ───
# niri: largura 683 (= 0.5 de 1366), opacidade 0.85, oculto no screencast
# Altura fixa 700 nao se aplica no scroller. shield_when_capture oculta em qualquer captura, nao so screencast.
window_rule=scroller_proportion:0.5,focused_opacity:0.85,unfocused_opacity:0.85,shield_when_capture:1,app_id:^org\.gnome\.Nautilus$

# ─── Zen ───
# Picture-in-Picture flutuante 480x270
window_rule=is_floating:1,width:480,height:270,app_id:zen,title:^Picture-in-Picture$
# Oculto em capturas de tela: Meet, WhatsApp e Gmail
window_rule=shield_when_capture:1,app_id:zen,title:(?i)^(meet|whatsapp|gmail)
# Regra do niri NAO portada: title "(?i)^($docs.google.com/spreadsheets$)"
# O "$" no meio do regex nunca casa, e "$docs" viraria variavel do Mango. Se quiser, use:
# window_rule=shield_when_capture:1,app_id:zen,title:(?i)docs\.google\.com/spreadsheets

# ─── Calculadora ───
window_rule=is_floating:1,width:360,height:616,app_id:^org\.gnome\.Calculator$,title:^Calculadora$

# ─── Vesktop e Blender ───
# niri: open-maximized. O Mango nao tem "abrir maximizado", entao usa coluna de largura total.
window_rule=scroller_proportion:1.0,app_id:^vesktop$
window_rule=scroller_proportion:1.0,app_id:^blender$

# ─── Proton Pass ───
window_rule=shield_when_capture:1,app_id:^proton-pass$

# ─── Mousepad ───
window_rule=focused_opacity:0.9,unfocused_opacity:0.9,app_id:^org\.xfce\.mousepad$

# ─── Zed ───
window_rule=focused_opacity:0.99,unfocused_opacity:0.99,app_id:^dev\.zed\.Zed$

# ─── Obsidian ───
window_rule=focused_opacity:0.95,unfocused_opacity:0.95,app_id:^md\.obsidian\.Obsidian$

# ─── Noctalia (janela de configuracoes) ───
# niri: scroll-factor 2. Nao existe regra equivalente por janela.

# ─── foot split ───
# niri: regra de open-focused false para o foot-split.sh. Sem uso, o script nao foi portado.

# ─── Alvo de screencast ───
# niri pintava de vermelho a janela capturada (is-window-cast-target). Sem equivalente.

# ═══ Layer rules (Noctalia) ═══
# niri: xray false nas superficies do Noctalia (blur real). Aqui o blur de layers vem de blur_layer=1.
# Notificacoes ocultas em captura, sem animacao do compositor
layer_rule=shield_when_capture:1,no_animation:1,layer_name:^noctalia-notification$
# Wallpaper sem blur (ja aparece em todas as tags, e uma layer de fundo)
layer_rule=no_blur:1,layer_name:^noctalia-wallpaper
# Regras de rofi do config padrao do Mango, desativadas porque o launcher e o do Noctalia:
# layer_rule=animation_type_open:zoom,layer_name:rofi
# layer_rule=animation_type_close:zoom,layer_name:rofi
