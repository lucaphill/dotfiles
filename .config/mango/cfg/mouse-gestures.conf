# Mouse, scroll e gestos (niri: binds de Wheel/Touchpad em keybinds.kdl)

# ─── Mouse ───
# Super + arrastar move/redimensiona (padrao do niri tambem)
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
# O niri nao maximiza no botao do meio, entao ficou desativado:
# mousebind=NONE,btn_middle,togglemaximizescreen,0

# ─── Scroll do mouse (Mod+Wheel do niri) ───
# O cooldown-ms do niri nao existe, o Mango usa axis_bind_apply_timeout (em misc.conf).
# Mod+Wheel vertical: tag anterior/proxima
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
# Mod+Ctrl+Wheel vertical: move a janela pra tag anterior/proxima
axisbind=SUPER+CTRL,UP,tagtoleft
axisbind=SUPER+CTRL,DOWN,tagtoright
# Mod+Wheel horizontal: foco entre colunas
axisbind=SUPER,LEFT,focusdir,left
axisbind=SUPER,RIGHT,focusdir,right
# Mod+Ctrl+Wheel horizontal: move a coluna
axisbind=SUPER+CTRL,LEFT,move_client,left
axisbind=SUPER+CTRL,RIGHT,move_client,right
# Mod+Shift+Wheel vertical: foco entre colunas
axisbind=SUPER+SHIFT,UP,focusdir,left
axisbind=SUPER+SHIFT,DOWN,focusdir,right
# Mod+Ctrl+Shift+Wheel vertical: move a coluna
axisbind=SUPER+CTRL+SHIFT,UP,move_client,left
axisbind=SUPER+CTRL+SHIFT,DOWN,move_client,right

# ─── Touchpad (Mod+TouchpadScroll do niri) ───
# Sem equivalente: o Mango nao tem bind de scroll de touchpad com modificador.
# Eram: Mod+Touchpad (mover coluna/janela), Mod+Shift+Touchpad (consume-or-expel e mover pra workspace).

# ─── Gestos ───
# 3 dedos aproximam o comportamento padrao do niri: horizontal = colunas, vertical = tags.
gesturebind=none,left,3,focusstack,next
gesturebind=none,right,3,focusstack,prev

gesturebind=none,up,3,viewtoright
gesturebind=none,down,3,viewtoleft

# 4 dedos: overview (padrao do Mango)
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview
