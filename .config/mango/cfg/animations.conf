# Animacoes (niri: animation.kdl)
# O niri usa springs (damping/stiffness). O Mango usa duracao + curva bezier,
# entao tudo abaixo e aproximacao. O shader customizado de window-close nao existe aqui.

# ─── Geral ───
# niri nao anima layers (barra, paineis); o Noctalia anima por conta propria.
animations=0
layer_animations=0
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8

# ─── Duracoes (ms) ───
# close: 250 igual ao niri (duration-ms 250)
animation_duration_move=250
animation_duration_open=250
animation_duration_tag=350
animation_duration_close=250
animation_duration_focus=0

# ─── Curvas ───
# open/move: bezier com leve overshoot, imitando o spring com damping 0.6
# close: linear, igual ao niri
animation_curve_open=0.34,1.56,0.64,1.0
animation_curve_move=0.34,1.3,0.64,1.0
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.0,0.0,1.0,1.0
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1
